[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial3d-flightanimation"
version = "0.1.0"
description = "FR24 KML to configurable stereoscopic flight animation"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
flightanimation = "flightanimation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
