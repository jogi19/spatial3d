[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial3d"
version = "0.1.0.dev0"
description = "Linux-first, inspectable toolkit for stereoscopic and spatial media"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "spatial3d contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
spatial3d = "spatial3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
